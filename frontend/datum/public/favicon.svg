<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Base medallion (blueprint-600) -->
  <circle cx="50" cy="50" r="45" fill="#2C4A5E" />
  
  <!-- Outer rim highlight -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#161B22" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Dashed survey line (paper-50) -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#F6F4EF" stroke-width="2" stroke-dasharray="4 4" />
  
  <!-- Coordinate crosshairs (paper-50) -->
  <path d="M 50 15 L 50 85 M 15 50 L 85 50" stroke="#F6F4EF" stroke-width="3" />
  
  <!-- Center fixed point (brass-500) -->
  <circle cx="50" cy="50" r="8" fill="#A9825A" />
  <circle cx="50" cy="50" r="4" fill="#161B22" fill-opacity="0.5" />
</svg>